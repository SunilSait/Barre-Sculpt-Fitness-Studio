<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Barre & Sculpt Fitness Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{if(localStorage.getItem('bs_theme')==='dark'){document.documentElement.classList.add('dark')}if(localStorage.getItem('bs_dir')==='rtl'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body>
<div class="cs-page">
    <div class="auth-utils">
        <button onclick="toggleDir()" class="nav-icon-btn" title="Toggle RTL/LTR"><span class="dir-indicator" style="font-size:0.625rem;font-weight:700;">RTL</span></button>
        <button onclick="toggleTheme()" class="nav-icon-btn" title="Toggle theme"><span class="theme-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>
    </div>
    <a href="index.html" style="display:flex;align-items:center;gap:12px;margin-bottom:40px;">
        <div class="nav-logo-icon">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="18" fill="#2D2D2D"/><path d="M30 25 L30 75" stroke="#C4A484" stroke-width="5" stroke-linecap="round"/><path d="M70 25 L70 75" stroke="#C4A484" stroke-width="5" stroke-linecap="round"/><path d="M30 40 L70 40" stroke="#C4A484" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="58" r="12" stroke="#C4A484" stroke-width="3.5" fill="none"/><path d="M50 50 L50 46" stroke="#C4A484" stroke-width="3" stroke-linecap="round"/><path d="M44 64 L40 72" stroke="#C4A484" stroke-width="3" stroke-linecap="round"/><path d="M56 64 L60 72" stroke="#C4A484" stroke-width="3" stroke-linecap="round"/></svg>
        </div>
        <div class="nav-logo-text"><span class="brand-top">Barre & Sculpt</span><span class="brand-bottom">Fitness Studio</span></div>
    </a>
    <div style="width:72px;height:72px;border-radius:50%;background:var(--primary-10);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <h2 style="font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3rem);margin-bottom:12px;">Coming Soon</h2>
    <p style="max-width:480px;margin:0 auto 32px;">We're working on something beautiful. Stay tuned for updates and be the first to know when we launch.</p>
    <div class="cs-countdown" id="countdown">
        <div class="cs-countdown-item"><div class="cs-countdown-value" id="cd-days">00</div><div class="cs-countdown-label">Days</div></div>
        <div class="cs-countdown-item"><div class="cs-countdown-value" id="cd-hours">00</div><div class="cs-countdown-label">Hours</div></div>
        <div class="cs-countdown-item"><div class="cs-countdown-value" id="cd-mins">00</div><div class="cs-countdown-label">Minutes</div></div>
        <div class="cs-countdown-item"><div class="cs-countdown-value" id="cd-secs">00</div><div class="cs-countdown-label">Seconds</div></div>
    </div>
    <form onsubmit="event.preventDefault();alert('Thank you! We\'ll notify you when we launch.');" style="display:flex;gap:12px;max-width:420px;margin:32px auto 0;width:100%;padding:0 16px;">
        <input type="email" class="form-input" placeholder="Enter your email" required style="flex:1;">
        <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Notify Me</button>
    </form>
    <a href="index.html" style="display:inline-block;margin-top:28px;font-size:0.8125rem;color:var(--primary);font-weight:600;">← Back to Home</a>
</div>
<script src="components.js"></script>
<script>
(function() {
    const target = new Date();
    target.setDate(target.getDate() + 30);
    function update() {
        const now = new Date();
        const diff = target - now;
        if (diff <= 0) return;
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('cd-days').textContent = String(d).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(m).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(s).padStart(2, '0');
    }
    update();
    setInterval(update, 1000);
})();
</script>
</body>
</html>
